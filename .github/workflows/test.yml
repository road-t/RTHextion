name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: ${{ runner.os == 'macOS' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="${QT_ROOT_DIR}/bin:$PATH"
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          cd test
          # Override qmake path in run_tests.sh
          sed -i.bak "s|QMAKE=qmake6|QMAKE=${QMAKE}|" run_tests.sh
          bash run_tests.sh
