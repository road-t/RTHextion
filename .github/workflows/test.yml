name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install aqtinstall
          python3 -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 --modules qtmultimedia -O "$HOME/Qt"
          echo "QT_ROOT_DIR=$HOME/Qt/6.7.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.7.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Install Capstone (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install capstone pkg-config

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libegl1 libfontconfig1 libcapstone-dev pkg-config qt6-multimedia-dev

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="${QT_ROOT_DIR}/bin:$PATH"
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export QT_PLUGIN_PATH="${QT_ROOT_DIR}/plugins"
          cd test
          # Override qmake path in run_tests.sh
          sed -i.bak "s|QMAKE=qmake6|QMAKE=${QMAKE}|" run_tests.sh
          bash run_tests.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Setup vcpkg (C:/vcpkg)
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/vcpkg/vcpkg.exe')) {
            if (!(Test-Path 'C:/vcpkg')) {
              git clone https://github.com/microsoft/vcpkg C:/vcpkg
            }
            & C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          }
          "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLATION_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Capstone + libiconv (vcpkg)
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe remove capstone:x64-windows-static --recurse >nul 2>&1
          C:\vcpkg\vcpkg.exe install capstone[arm,m68k,mips,x86,mos65xx]:x64-windows-static --triplet x64-windows-static --disable-metrics
          C:\vcpkg\vcpkg.exe install libiconv:x64-windows-static --triplet x64-windows-static --disable-metrics

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app and verify Capstone linkage
        shell: cmd
        run: |
          setlocal
          set VCPKG_ROOT_FWD=C:/vcpkg

          mkdir build_smoke
          cd build_smoke

          "%QT_ROOT_DIR%\bin\qmake" ..\src\rthextion.pro CONFIG+=debug ^
            CONFIG+=capstone_from_cli ^
            "INCLUDEPATH+=%VCPKG_ROOT_FWD%/installed/x64-windows-static/include" ^
            "LIBS+=%VCPKG_ROOT_FWD%/installed/x64-windows-static/lib/iconv.lib" ^
            "LIBS+=%VCPKG_ROOT_FWD%/installed/x64-windows-static/lib/capstone.lib"

          if not exist Makefile (
            echo ERROR: qmake did not generate Makefile
            exit /b 1
          )

          findstr /i /c:"capstone" Makefile >nul
          if errorlevel 1 (
            echo ERROR: Generated Makefile does not contain capstone linkage
            exit /b 1
          )

          findstr /i /c:"QtMultimedia" /c:"Qt6Multimedia" /c:"QT_MULTIMEDIA_LIB" Makefile >nul
          if errorlevel 1 (
            echo ERROR: Generated Makefile does not contain Qt Multimedia linkage
            exit /b 1
          )

          nmake /nologo

      - name: Runtime probe for required Capstone backends
        shell: pwsh
        run: |
          $capstoneProbe = @'
          #include <capstone/capstone.h>
          #include <stdio.h>

          static int check_required(cs_arch arch, cs_mode mode, int code, const char *name)
          {
              csh h = 0;
              cs_err err = cs_open(arch, mode, &h);
              if (err != CS_ERR_OK) {
                  printf("ERROR: required backend %s failed: %s\n", name, cs_strerror(err));
                  return code;
              }
              cs_close(&h);
              return 0;
          }

          int main(void)
          {
              printf("cs_support: ARM=%d M68K=%d MIPS=%d X86=%d\n",
                     cs_support(CS_ARCH_ARM),
                     cs_support(CS_ARCH_M68K),
                     cs_support(CS_ARCH_MIPS),
                     cs_support(CS_ARCH_X86));

              int rc = 0;
              rc = check_required(CS_ARCH_ARM, CS_MODE_THUMB, 11, "ARM/thumb");
              if (rc) return rc;
              rc = check_required(CS_ARCH_M68K, CS_MODE_M68K_000, 12, "M68K/68000");
              if (rc) return rc;
              rc = check_required(CS_ARCH_MIPS, (cs_mode)(CS_MODE_MIPS64 | CS_MODE_BIG_ENDIAN), 13, "MIPS64/BE");
              if (rc) return rc;
              rc = check_required(CS_ARCH_X86, CS_MODE_16, 14, "X86/16");
              if (rc) return rc;

          #if defined(CS_API_MAJOR) && (CS_API_MAJOR >= 5)
              csh h = 0;
              cs_err mosErr = cs_open(CS_ARCH_MOS65XX, CS_MODE_MOS65XX_6502, &h);
              if (mosErr == CS_ERR_OK) {
                  cs_close(&h);
                  printf("MOS65XX backend: available\n");
              } else {
                  printf("WARNING: MOS65XX backend is unavailable in this Capstone build: %s\n", cs_strerror(mosErr));
              }
          #endif

              return 0;
          }
          '@

          Set-Content -Path capstone_smoke.cpp -Value $capstoneProbe -Encoding ascii

          cl /nologo /EHsc capstone_smoke.cpp `
            /I"C:/vcpkg/installed/x64-windows-static/include" `
            "C:/vcpkg/installed/x64-windows-static/lib/capstone.lib" `
            /link /OUT:capstone_smoke.exe

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to compile capstone_smoke.cpp"
          }

          & .\capstone_smoke.exe
          $probeExit = $LASTEXITCODE
          Write-Host "capstone_smoke exit code: $probeExit"
          if ($probeExit -ne 0) {
            throw "Capstone runtime probe failed with exit code $probeExit"
          }
