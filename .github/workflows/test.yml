name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install aqtinstall
          python3 -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 -O "$HOME/Qt"
          echo "QT_ROOT_DIR=$HOME/Qt/6.7.3/gcc_64" >> "$GITHUB_ENV"
          echo "$HOME/Qt/6.7.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libegl1 libfontconfig1

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}/plugins
        run: |
          export PATH="${QT_ROOT_DIR}/bin:$PATH"
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          cd test
          # Override qmake path in run_tests.sh
          sed -i.bak "s|QMAKE=qmake6|QMAKE=${QMAKE}|" run_tests.sh
          bash run_tests.sh
